<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flaker</title>
    <link rel="stylesheet" href="canvas.css">
</head>
<body>
    <div id="background">
        <div class="tile-dots"></div>

        <div id="viewport">
            <svg id="canvas-svg"></svg>
        </div>

        <div id="furniture-menu">
            <h2>Furniture</h2>
            <div id="furniture-list"></div>
        </div>

        <div id="keybind-panel" class="open">
            <div id="keybind-panel-content"></div>
            <button type="button" id="keybind-close" title="Hide keybinds" aria-label="Hide keybinds">&times;</button>
        </div>

        <button type="button" id="keybind-open" title="Show keybinds" aria-label="Show keybinds">
            <span>Keybinds</span>
            <span class="keybind-open-icon">&#8963;</span>
        </button>

        <div id="tool-select">
            <button type="button" class="active" data-mode="vertex">Vertex <kbd>1</kbd></button>
            <button type="button" data-mode="edge">Edge <kbd>2</kbd></button>
            <button type="button" data-mode="edgeVertex">Door / Window <kbd>3</kbd></button>
            <button type="button" data-mode="furniture">Furniture <kbd>4</kbd></button>
            <div id="grid-size-control" title="Grid cell size in units">
                <span>Grid</span>
                <input id="grid-size-slider" type="range" min="0.1" max="3" step="0.1" value="1" aria-label="Grid size">
                <input id="grid-size-input" type="number" min="0.1" max="3" step="0.1" value="1" aria-label="Grid size value">
            </div>
            <div id="zoom-controls">
                <button type="button" id="zoom-out" title="Zoom out (-)">&minus;</button>
                <button type="button" id="zoom-in" title="Zoom in (+)">+</button>
                <button type="button" id="zoom-reset" title="Reset view (0)">Reset</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
